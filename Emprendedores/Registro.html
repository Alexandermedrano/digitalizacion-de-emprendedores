<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITALIZACION DE EMPRENDEDORES</title>
</head>
<body>

    <main>
        <h2>Crear una Cuenta</h2>
        <p>Únete a nuestra comunidad de emprendedores. Es gratis y sencillo.</p>
        
        <form action="#" method="post">
            <p>
                <label for="nombre-completo">Nombre completo:</label><br>
                <input type="text" id="nombre-completo" name="nombre-completo" required>
            </p>
            <p>
                <label for="nuevo-correo">Correo electrónico:</label><br>
                <input type="email" id="nuevo-correo" name="nuevo-correo" required>
            </p>
            <p>
                <label for="nueva-contrasena">Contraseña:</label><br>
                <input type="password" id="nueva-contrasena" name="nueva-contrasena" required>
            </p>
            <p>
                <label for="confirmar-contrasena">Confirmar contraseña:</label><br>
                <input type="password" id="confirmar-contrasena" name="confirmar-contrasena" required>
            </p>
            <p>
                <button type="submit">Crear Cuenta</button>
            </p>
        </form>
        
        <p>¿Ya tienes cuenta? <a href="inicio-sesion.html">Inicia sesión aquí</a></p>
        <p><a href="Menu-Principal.html"> continuar sin registrarse </a></p>
    </main>

    <footer>
        <p>&copy; 2026 Emprende Fácil. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
